<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fullfast SPA</title>
</head>
<body>

<div id="app"></div>

<!-- Module imports -->
<script type="module">
    import { Q } from './dist/index.js';
    import { RootingFast } from './dist/rooting.js';
    import { FX } from './dist/fx.js';

    window.Q = Q;
    window.RootingFast = RootingFast;
    window.FX = FX;

    // --- 1. Global Setup ---
    Q.global(`
        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8f9fa; color: #1a1a1a; overflow-x: hidden;
        }
        .nav-bar { background: #fff; border-bottom: 1px solid #ddd; padding: 20px 40px; display: flex; gap: 20px; }
        .nav-bar a { text-decoration: none; color: #666; font-weight: 700; cursor: pointer; }
        .nav-bar a:hover { color: #0070f3; }
        .page { padding: 40px; max-width: 800px; margin: 0 auto; }
    `);

    // --- 2. Components ---
    function Layout(parent, contentFn, ...args) {
        const root = parent.el("div");
        const nav = root.el("div.nav-bar");
        nav.el("a").attr("href", "/").text("HOME");
        nav.el("a").attr("href", "/dashboard").text("DASHBOARD");

        const page = root.el("div.page");
        contentFn(page, ...args);
    }

    // --- 3. Pages ---
    async function HomePage(ctx, scp) {
        const app = Q("#app");
        app[0].innerHTML = "";
        
        app.el(Layout, (page) => {
            const h = page.el("h1").text("fullfast Backbone");
            page.el("p").text("This page is running with fullfast modules.");
        });
    }

    async function DashboardPage(ctx, scp) {
        const app = Q("#app");
        app[0].innerHTML = "";

        app.el(Layout, (page) => {
            page.el("h1").text("Atomic Dashboard");
            if (!scp.visits) scp.visits = Q.state(0);
            scp.visits.value++;
            page.el("div").text(`Visits: `).bind(scp.visits, v => v, 'text');
        });
    }

    // --- 4. Initialize Router ---
    RootingFast.route({
        "/": HomePage,
        "/dashboard": DashboardPage
    });
</script>
</body>
</html>
